[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-world-model"
version = "0.1.0"
description = "Single-GPU existing-model training and qualification base for latent-world-model research"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["native: requires acquired released model/data assets and admitted native execution"]
