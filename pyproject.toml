[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-world-model"
version = "0.1.0"
description = "Predictive text state with persistent memory and recurrent latent computation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1",
  "numpy==2.1.3",
  "transformers==4.46.3",
  "tokenizers==0.20.3",
  "huggingface-hub==0.34.4",
  "pyarrow==18.1.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
